<!DOCTYPE html><html><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Lovely Money</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--p:#1650b0}*{box-sizing:border-box}
body{margin:0;font:14px system-ui,sans-serif;background:#f3f7fd;color:#223}
button,input,select{font:inherit}[hidden]{display:none!important}
#side{position:fixed;inset:0 auto 0 0;width:190px;background:var(--p);color:#fff;padding:14px 8px}
#side h2{text-align:center;font-size:16px;margin:0 0 14px}
#side a{display:block;padding:10px 12px;border-radius:8px;color:#fff;cursor:pointer}
#side a.on{background:rgba(255,255,255,.22)}
main{margin-left:190px;padding:18px 22px}h1{color:var(--p);font-size:22px;margin:0 0 14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.sp{flex:1}
.btn{background:var(--p);color:#fff;border:0;border-radius:18px;padding:8px 16px;cursor:pointer}
.btn.o{background:#fff;color:var(--p);border:1px solid var(--p)}.btn.s{padding:3px 10px;font-size:12px}
.tab{padding:6px 14px;border-radius:16px;cursor:pointer;background:#fff}.tab.on{background:var(--p);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:14px}
.k{border-radius:14px;color:#fff;padding:14px}.k b{display:block;font-size:20px;margin:6px 0}.k small{opacity:.9}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 6px #0001}
.card h3{margin:0 0 10px;font-size:14px;color:var(--p)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid #eef}
th{font-size:12px;color:#667}.wrap{overflow-x:auto}
.neg{color:#d33}.pos{color:#1a9a5a}
.pb{height:8px;border-radius:6px;background:#e8edf5;overflow:hidden;margin:4px 0}.pb i{display:block;height:100%;background:#1a9a5a}
.pb.w i{background:#e6a817}.pb.d i{background:#d33}
.cols{display:flex;align-items:flex-end;gap:10px;height:130px}.cols div{flex:1;text-align:center;font-size:11px}
.cols span{display:inline-block;width:42%;border-radius:3px 3px 0 0;min-height:2px}
.al{background:#fff4d6;border-left:4px solid #e6a817;padding:8px 12px;border-radius:8px;margin-bottom:6px}
dialog{border:0;border-radius:14px;padding:18px;width:min(420px,94vw)}
dialog label{display:block;margin:8px 0 2px;font-size:12px;color:#667}
dialog input,dialog select{width:100%;padding:8px;border:1px solid #cde;border-radius:8px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--p)}
#login .card{width:min(340px,92vw)}#login input{width:100%;margin:6px 0;padding:10px;border:1px solid #cde;border-radius:8px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-bottom:14px}.sec{margin:16px 0 8px;color:#667;font-size:12px;letter-spacing:.05em}
.emo{max-height:110px;overflow:auto;margin-top:4px}.emo button{border:1px solid #cde;background:#fff;border-radius:8px;font-size:18px;margin:2px;cursor:pointer}
.err{color:#d33;font-size:13px}
@media(max-width:720px){#side{inset:auto 0 0 0;width:auto;display:flex;padding:4px;z-index:5}#side h2{display:none}
#side{overflow-x:auto}#side a{flex:1 0 auto;text-align:center;padding:10px 8px;font-size:11px;white-space:nowrap}main{margin:0;padding:12px 10px 70px}}

/* Hiệu ứng bấm nút */
.btn,.emo button,nav a,#side a{transition:transform .12s ease,box-shadow .2s ease,filter .2s ease,background .2s ease;-webkit-tap-highlight-color:transparent}
.btn{position:relative;overflow:hidden}
.btn:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 4px 12px rgba(0,0,0,.18);transform:translateY(-1px)}
.btn.o:hover:not(:disabled){background:#f0f5ff;filter:none}
.btn:active:not(:disabled){transform:scale(.94);box-shadow:none;filter:brightness(.95)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.emo button:active{transform:scale(.85)}
#side a:active{transform:scale(.97)}
.btn .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .55s ease-out;pointer-events:none}
.btn.o .rip{background:rgba(22,80,176,.22)}
@keyframes rip{to{transform:scale(3.2);opacity:0}}
.btn.busy{pointer-events:none;opacity:.7}
.btn.busy::after{content:'';display:inline-block;width:12px;height:12px;margin-left:8px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;vertical-align:-2px;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div id="login"><div class="card"><h2 style="text-align:center;color:var(--p)">LOVELY MONEY</h2>
<div id="err" class="err"></div><input id="u" placeholder="Tên đăng nhập" value="admin">
<input id="pw" type="password" placeholder="Mật khẩu" onkeydown="if(event.key=='Enter')login()">
<button class="btn" style="width:100%" onclick="login()">Đăng nhập</button></div></div>
<div id="app" hidden><nav id="side"><h2>LOVELY MONEY</h2></nav><main id="m"></main></div>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),fm=n=>Math.round(+n||0).toLocaleString('vi-VN')+' VND',
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
p2=n=>('0'+n).slice(-2),iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
let tok,D,B,view='dash',per='m',sub='Budget',ct='Chi',pg=1,st={},PS=10,flt={t:'',q:'',a:'',c:'',f:'',e:''},fo,cf=iso(new Date(new Date().getFullYear(),new Date().getMonth(),1)),ce=iso(new Date());
const NAV=[['dash','Tổng quan'],['tx','Giao dịch'],['acc','Tài khoản'],['plan','Kế hoạch'],['cat','Danh mục'],['debt','Nợ & Đầu tư'],['guide','Hướng dẫn'],['set','Cài đặt']];
$('#side').innerHTML+=NAV.map(n=>`<a id="n_${n[0]}" onclick="go('${n[0]}')">${n[1]}</a>`).join('');
const API='https://script.google.com/macros/s/AKfycbyggF8gZKwOfuTBFzD5GVvNkL21bkrm52Mo8azUJrgsprNW5Gwjw71c4LRXUjxF1g98/exec'; // https://script.google.com/macros/s/XXXX/exec
async function api(fn,args){
 let r,txt;
 try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})});txt=await r.text();}
 catch(e){console.error('[API]',fn,e);throw new Error('Không kết nối được máy chủ ('+fn+'): '+e.message);}
 let j;try{j=JSON.parse(txt)}catch(e){console.error('[API]',fn,r.status,txt.slice(0,500));
  throw new Error('Máy chủ trả về dữ liệu không hợp lệ ('+fn+', mã '+r.status+'). Kiểm tra: đã triển khai phiên bản mới nhất và quyền "Bất kỳ ai" chưa?');}
 if(!j.ok){console.error('[API]',fn,j.error);throw new Error(j.error);}
 return j.data;}
const call=(fn,...a)=>api(fn,[tok,...a]).catch(e=>{alert(e.message);if(/hết hạn/.test(e.message)){sessionStorage.removeItem('lm');location.reload()}throw e;});
function apply(r){D=r.data;B=r.bal;try{sessionStorage.setItem('lm',JSON.stringify({tok,r}))}catch(e){}}
function show(){$('#login').hidden=true;$('#app').hidden=false;go(view)}
function login(){api('loginLoad',[$('#u').value,$('#pw').value]).then(r=>{tok=r.tok;apply(r);show()}).catch(e=>$('#err').textContent=e.message)}
api('ping',[]).catch(()=>{}); // đánh thức máy chủ trong lúc bạn nhập mật khẩu
// Khôi phục phiên: hiện dữ liệu cũ ngay, rồi làm mới ngầm
setTimeout(()=>{try{const c=JSON.parse(sessionStorage.getItem('lm')||'null');if(c){tok=c.tok;D=c.r.data;B=c.r.bal;show();
 api('load',[tok]).then(apply0).catch(()=>{sessionStorage.removeItem('lm');location.reload()})}}catch(e){sessionStorage.removeItem('lm')}},0);
function apply0(r){apply(r);go(view)}

function go(v){view=v;NAV.forEach(n=>$('#n_'+n[0]).classList.toggle('on',n[0]==v));
 $('#m').innerHTML=hdr()+({dash,tx,acc,plan,cat,debt,guide,set})[v]();if(v=='dash')charts()}
async function reload(){apply0(await call('load'))}

// ----- form schema -----
const O=(n,k='Name')=>D[n].map(x=>x[k]);
const EMO=['🏦','💵','📱','💳','💰','🪙','🏠','🚗','🛒','🍔','☕','⚡','🎬','💊','🎁','💼','✈️','📚','🎓','👕','🐶','🏋️','📝','🔧','📈','🏷️','🎮','🧾','👶','🛵'],
DI={'Lương':'💼','Thưởng':'🎁','Freelance':'💰','Ăn uống':'🍔','Tiền nhà':'🏠','Đi lại':'🚗','Mua sắm':'🛒','Hoá đơn':'⚡','Giải trí':'🎬','Sức khoẻ':'💊','Khác':'📝','Chuyển khoản':'🔄','Trả nợ':'🤝','Lãi đầu tư':'📈','Lỗ đầu tư':'📉'},
TI={'Ngân hàng':'🏦','Tiền mặt':'💵','Ví điện tử':'📱','Thẻ tín dụng':'💳'},
ci=n=>{const c=D.Categories.find(x=>x.Name==n);return esc(c?.Icon||DI[n]||'🏷️')},
ai=n=>{const a=D.Accounts.find(x=>x.Name==n);return esc(a?.Icon||TI[a?.Type]||'💳')},
tot=(rows,ty)=>rows.filter(t=>t.Type==ty).reduce((s,t)=>s+ +t.Amount,0);
const F={
Accounts:{Name:'t',Icon:'e',Type:['Ngân hàng','Tiền mặt','Ví điện tử','Thẻ tín dụng'],Opening:'n'},
Categories:{Name:'t',Icon:'e',Type:['Chi','Thu'],Budget:'n'},
Transactions:{Date:'d',Type:['Chi','Thu','Chuyển khoản'],Category:()=>O('Categories'),Account:()=>O('Accounts'),ToAccount:()=>['',...O('Accounts')],Amount:'n',Note:'t'},
Recurring:{Name:'t',Type:['Chi','Thu'],Category:()=>O('Categories'),Account:()=>O('Accounts'),Amount:'n',Day:'n'},
Goals:{Name:'t',Target:'n',Saved:'n',Deadline:'d'},
Debts:{Name:'t',Principal:'n',Paid:'n',Start:'d',Due:'d',Rate:'n',Status:['Đang vay','Đã trả']},
Investments:{Name:'t',Kind:['Vàng','Tiết kiệm','Chứng khoán','Khác'],Amount:'n',Start:'d',Return:'n',Status:['Đang đầu tư','Đã kết thúc']}};
const L={Progress:'Tiến độ trả',Icon:'Biểu tượng',Name:'Tên',Type:'Loại',Opening:'Số dư đầu',Budget:'Ngân sách tháng',Date:'Ngày',Category:'Danh mục',Account:'Tài khoản',ToAccount:'Đến tài khoản',Amount:'Số tiền',Note:'Ghi chú',Day:'Ngày trong tháng',Target:'Mục tiêu',Saved:'Đã tiết kiệm',Deadline:'Hạn',Principal:'Số tiền vay',Paid:'Đã trả',Start:'Ngày bắt đầu',Due:'Đáo hạn',Rate:'Lãi suất %',Status:'Trạng thái',Kind:'Loại hình',Return:'Lợi nhuận dự kiến %',Source:'Nguồn'};
function openForm(n,id){const o=id?D[n].find(x=>x.ID==id):{Date:iso(new Date()),Type:F[n].Type?.[0]};
 const h=Object.entries(F[n]).map(([k,s])=>{const v=esc(o[k]??''),t=typeof s=='function'?s():s;
  return`<label>${L[k]}</label>`+(Array.isArray(t)?`<select id="f_${k}">${t.map(x=>`<option value="${esc(x)}" ${x==o[k]?'selected':''}>${x?(k=='Category'?ci(x)+' ':/Account/.test(k)?ai(x)+' ':''):''}${esc(x)}</option>`).join('')}</select>`
  :s=='e'?`<input id="f_${k}" value="${v}" maxlength="4" style="font-size:20px"><div class="emo">${EMO.map(e=>`<button type="button" onclick="$('#f_${k}').value='${e}'">${e}</button>`).join('')}</div>`:`<input id="f_${k}" type="${s=='n'?'number':s=='d'?'date':'text'}" value="${v}">`)}).join('');
 $('#dlg').innerHTML=`<h3>${id?'Sửa':'Thêm'}</h3>${h}<div class="bar" style="margin-top:14px"><span class="sp"></span><button class="btn o" onclick="$('#dlg').close()">Đóng</button><button class="btn" onclick="sv('${n}','${id||''}')">Lưu</button></div>`;
 dlgOpen();fo=o;$('#dlg').oninput=n=='Transactions'?()=>fch():null;if(n=='Transactions')fch()}
function fch(){if(!$('#f_Type'))return;const o=fo,ty=$('#f_Type').value,sel=$('#f_Category');
 if(sel.dataset.t!=ty){const cur=o?.Category||sel.value;sel.innerHTML=D.Categories.filter(c=>c.Type==ty).map(c=>`<option value="${esc(c.Name)}" ${c.Name==cur?'selected':''}>${ci(c.Name)} ${esc(c.Name)}</option>`).join('');sel.dataset.t=ty}
 const tr=ty=='Chuyển khoản';[...$('#dlg').querySelectorAll('label')].forEach(l=>{const e=l.nextElementSibling;if(e?.id=='f_ToAccount')l.hidden=e.hidden=!tr;if(e?.id=='f_Category')l.hidden=e.hidden=tr});
 if(!$('#fhint'))$('#dlg .bar').insertAdjacentHTML('beforebegin','<div id="fhint" style="margin-top:10px"></div>');
 const a=$('#f_Account').value,m=+$('#f_Amount').value||0;let h='';
 if(ty!='Thu'&&a){let cur=B[a]||0;const old=o?.ID&&D.Transactions.find(x=>x.ID==o.ID);if(old&&old.Account==a&&old.Type!='Thu')cur+=+old.Amount;
  h+=`<div class="al">Số dư ${esc(a)} sau giao dịch: <b class="${cur-m<0?'neg':''}">${fm(cur-m)}</b>`;
  const c=ty=='Chi'&&D.Categories.find(x=>x.Name==sel.value);
  if(c&&+c.Budget>0){const t=sum('Chi',range0(),x=>x.Category==c.Name&&x.ID!=o?.ID)+m;if(t>c.Budget)h+=`<br>⚠️ Vượt ngân sách "${esc(c.Name)}": ${fm(t)} / ${fm(c.Budget)}`}h+='</div>'}
 if(o?.Source){$('#f_Type').disabled=true;sel.disabled=true;h+=`<div class="al">Giao dịch tự động (${esc(o.Source)}): không đổi được loại/danh mục.${o.Source=='Nợ'?' Sửa số tiền sẽ cập nhật khoản nợ.':''}</div>`}
 $('#fhint').innerHTML=h}
async function sv(n,id){const o={ID:id};for(const k in F[n])o[k]=$('#f_'+k).value;
 apply0(await call('save',n,o));$('#dlg').close()}
async function rm(n,id){const t=n=='Transactions'&&D.Transactions.find(x=>x.ID==id);
 if(confirm(t&&t.Source?`Giao dịch này được tạo tự động từ "${t.Source}". Xoá sẽ hoàn lại khoản liên quan. Tiếp tục?`:'Xoá bản ghi này?')){apply0(await call('del',n,id))}}
async function ac(k,id,q,acc){let a=0;if(q){a=prompt(q);if(a===null)return}
 if(acc){acc=prompt('Tài khoản ('+O('Accounts').join(', ')+'):',O('Accounts')[0]);if(!acc)return}
 apply0(await call('act',k,id,+a,acc))}

// ----- helpers -----
const due=r=>+r.Day<=new Date().getDate()&&String(r.LastRun).slice(0,7)!=iso(new Date()).slice(0,7);
function alerts(){const n=new Date(),al=[],mr=range0();
 D.Debts.filter(d=>d.Status!='Đã trả'&&d.Due&&(new Date(d.Due+'T00:00:00')-n)/864e5<=7).forEach(d=>al.push(`Nợ "${d.Name}" đến hạn ${d.Due}`));
 D.Recurring.filter(due).forEach(r=>al.push(`Khoản định kỳ "${r.Name}" đã đến hạn ghi nhận`));
 D.Categories.filter(c=>c.Type=='Chi'&&+c.Budget>0).forEach(c=>{if(sum('Chi',mr,t=>t.Category==c.Name)>=c.Budget)al.push(`Ngân sách "${c.Name}" đã dùng 100%`)});
 Object.entries(B).forEach(([k,v])=>{const a=D.Accounts.find(x=>x.Name==k);if(v<0&&a?.Type!='Thẻ tín dụng')al.push(`Tài khoản "${k}" đang âm`)});return al}
function hdr(){const a=alerts();return`<div class="bar" style="justify-content:flex-end;position:relative"><button class="btn s o" onclick="$('#bl').hidden=!$('#bl').hidden">🔔 ${a.length}</button><button class="btn s o" onclick="location.reload()">Đăng xuất</button>
 <div id="bl" hidden class="card" style="position:absolute;top:34px;right:0;z-index:9;width:min(330px,92vw)"><h3>Cảnh báo & nhắc nhở</h3>${a.map(x=>`<div class="al">${esc(x)}</div>`).join('')||'Không có cảnh báo'}</div></div>`}
function range(off){const n=new Date(),y=n.getFullYear(),m=n.getMonth();let a,b;
 if(per=='c'){a=new Date(cf+'T00:00:00');b=new Date(ce+'T00:00:00');const L=Math.round((b-a)/864e5)+1;a.setDate(a.getDate()+off*L);b.setDate(b.getDate()+off*L);return[iso(a),iso(b)]}
 if(per=='m'){a=new Date(y,m+off,1);b=new Date(y,m+off+1,0)}
 else if(per=='q'){const q=Math.floor(m/3)*3+off*3;a=new Date(y,q,1);b=new Date(y,q+3,0)}
 else{a=new Date(y+off,0,1);b=new Date(y+off,11,31)}return[iso(a),iso(b)]}
const sum=(ty,r,f=()=>1)=>D.Transactions.filter(t=>t.Type==ty&&t.Date>=r[0]&&t.Date<=r[1]&&f(t)).reduce((s,t)=>s+ +t.Amount,0);
const pb=(v,max,g)=>{const p=max?Math.min(100,v/max*100):0;return`<div class="pb ${g?'':p>=100?'d':p>=80?'w':''}"><i style="width:${p}%"></i></div>`};
const tbl=(n,cols,extra=()=>'')=>`<div class="wrap"><table><tr>${cols.map(c=>`<th>${L[c]}</th>`).join('')}<th></th></tr>`+
 D[n].map(r=>`<tr>${cols.map(c=>`<td>${c=='Progress'?`<div style="min-width:110px">${pb(r.Paid,r.Principal,1)}<small>Còn ${fm(r.Principal-r.Paid)}</small></div>`:c=='Amount'||c=='Opening'||c=='Principal'||c=='Target'||c=='Budget'||c=='Paid'||c=='Saved'?fm(r[c]):(c=='Category'?ci(r[c])+' ':c=='Account'?ai(r[c])+' ':'')+esc(r[c])}</td>`).join('')}<td style="white-space:nowrap">${extra(r)}<button class="btn s o" onclick="openForm('${n}','${r.ID}')">Sửa</button> <button class="btn s o" onclick="rm('${n}','${r.ID}')">Xoá</button></td></tr>`).join('')+`</table></div>`;
const head=(t,btn)=>`<div class="bar"><h1 style="margin:0">${t}</h1><span class="sp"></span>${btn||''}</div>`;

// ----- views -----
function dash(){const r=range(0),pr=range(-1),inc=sum('Thu',r),exp=sum('Chi',r),pi=sum('Thu',pr),pe=sum('Chi',pr),
 debt=D.Debts.reduce((s,d)=>s+d.Principal-d.Paid,0),inv=D.Investments.filter(i=>i.Status=='Đang đầu tư').reduce((s,i)=>s+ +i.Amount,0),
 net=Object.values(B).reduce((a,b)=>a+b,0)+inv-debt,n=new Date(),mr=range0(),al=[],
 ch=(a,b)=>b?(a>=b?'▲ ':'▼ ')+Math.abs(Math.round((a-b)/b*100))+'% so với kỳ trước':'—',
 K=(t,v,s,c)=>`<div class="k" style="background:${c}">${t}<b>${v}</b><small>${s}</small></div>`,
 C=(id,t)=>`<div class="card"><h3>${t}</h3><div style="height:210px"><canvas id="${id}"></canvas></div></div>`,
 S=t=>`<h4 class="sec">${t}</h4>`;
 return head('Tổng quan tài chính',['m','q','y','c'].map(p=>`<span class="tab ${per==p?'on':''}" onclick="per='${p}';go('dash')">${{m:'Tháng này',q:'Quý này',y:'Năm nay',c:'Tùy chỉnh'}[p]}</span>`).join('')+(per=='c'?` <input type="date" value="${cf}" onchange="cf=this.value;go('dash')"> – <input type="date" value="${ce}" onchange="ce=this.value;go('dash')">`:''))+
 `<div class="grid">${K('Tài sản ròng',fm(net),'Đã trừ '+fm(debt)+' nợ','#2f6fd6')}${K('Thu nhập',fm(inc),ch(inc,pi),'#1fa463')}${K('Chi tiêu',fm(exp),ch(exp,pe),'#e05563')}${K('Tiết kiệm',fm(inc-exp),(inc?Math.round((inc-exp)/inc*100):0)+'% tỷ lệ tiết kiệm','#e09a12')}</div>`+
 S('THU & CHI')+`<div class="g3">${C('c1','Thu – Chi 6 tháng gần nhất')}${C('c2','Chi tiêu theo danh mục')}${C('c3','Thu nhập theo nguồn')}</div>`+
 S('XU HƯỚNG')+`<div class="g3">${C('c4','Số dư theo thời gian')}${C('c5','Chi tiêu lũy kế trong tháng')}${C('c6','Thu lũy kế trong tháng')}</div>`+
 S('TÀI SẢN, NỢ & MỤC TIÊU')+`<div class="g3">${C('c7','Cơ cấu tài sản')}${C('c8','Đầu tư đang hoạt động')}${C('c9','Tiến độ trả nợ')}${C('c10','Mục tiêu tiết kiệm')}${C('c11','Ngân sách tháng này')}</div>`}

 const a=prompt('Tài khoản nhận ('+O('Accounts').join(', ')+'):',O('Accounts')[0]);if(a)call('act','close',id,+v,a).then(reload)}

function set(){return head('Cài đặt')+`<div class="card" style="margin-bottom:12px"><h3>Màu chủ đề</h3>${['#1650b0','#7b4fa0','#cc5a9e','#1f9a5a','#d9701c'].map(c=>`<button onclick="th('${c}')" style="width:34px;height:34px;border-radius:50%;border:0;background:${c};margin-right:8px"></button>`).join('')}</div>
 <div class="card"><h3>Bảo mật</h3><input id="np" type="password" placeholder="Mật khẩu mới (≥6 ký tự)"> <button class="btn" onclick="call('changePw',$('#np').value).then(()=>alert('Đã đổi mật khẩu'))">Đổi mật khẩu</button><p><small>Phiên đăng nhập hết hạn sau 60 phút.</small></p></div>`}
function th(c){document.documentElement.style.setProperty('--p',c);try{localStorage.th=c}catch(e){}}
try{if(localStorage.th)th(localStorage.th)}catch(e){}
</script><script>
// Ripple khi bấm nút + quay vòng khi đang gửi dữ liệu
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn');if(!b||b.disabled)return;
 const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),x=document.createElement('span');
 x.className='rip';x.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
 b.appendChild(x);setTimeout(()=>x.remove(),600)});
document.addEventListener('click',e=>{const b=e.target.closest('.btn');if(!b||b.disabled)return;
 if(/^(Đăng nhập|Lưu)$/.test(b.textContent.trim())){b.classList.add('busy');setTimeout(()=>b.classList.remove('busy'),4000)}},true);
</script>
